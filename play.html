<body class="padBody">
  <div id="joinScr" class="screen">
    <div class="joinHead">
      <h1 class="ccMark"><span class="w1">couch</span><span class="w2">chaos<em>os</em></span></h1>
      <p>Your phone is the controller. Type the code shown on the TV.</p>
    </div>
    <div class="joinCard">
      <label>Room code<input id="roomIn" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD"></label>
      <label>Your name<span class="nameRow"><input id="nameIn" maxlength="12" autocomplete="nickname" placeholder="Pick a name"><button id="diceName" type="button" title="Random name" aria-label="Random name">🎲</button></span></label>
      <button id="joinBtn" class="big">Join the party</button>
      <div id="joinErr" class="err"></div>
    </div>
    <p class="joinFoot">Up to 8 players · no app or account needed</p>
  </div>

  <div id="ctrlScr" class="screen hidden">
    <div class="topbar">
      <span id="meDot" class="dot"></span><span id="meName"></span>
      <button id="ctrlBtn" class="chip ctrlBtn hidden">🕹️ Joystick</button>
      <button id="tiltBtn" class="chip hidden">Tilt: off</button>
      <button id="centerBtn" class="chip hidden">⟲ Center</button>
      <button id="flipBtn" class="chip hidden">⇄</button>
      <button id="reactBtn" class="chip reactBtn" aria-label="Reactions">😀</button>
      <span id="status" class="status"></span>
    </div>
    <div id="reactRow" class="reactRow hidden"></div>
    <div id="stage"></div>
    <div id="emoteDock" class="emoteDock hidden"></div>
  </div>
  <div id="toast"></div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>window.Peer || document.write('<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"><\/script>')</script>
  <script src="turn-config.js?v=1795844507"></script>
  <script src="shared.js?v=1795844507"></script>
  <script src="cam.js?v=1795844507"></script>
  <script src="play.js?v=1795844507"></script>
  <script src="press.js?v=1795844507"></script>
</body>
</html>
