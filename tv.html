<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Couch Chaos — TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="tv">
  <div id="start" class="overlay">
    <h1 class="logo">COUCH<span>CHAOS</span></h1>
    <button id="startBtn" class="big">📺 Start the party</button>
    <p class="muted">Tip: press F to go fullscreen on the TV.</p>
  </div>

  <div id="lobby" class="hidden">
    <header>
      <h1 class="logo">COUCH<span>CHAOS</span></h1>
      <div class="headHint">The 👑 VIP picks the game on their controller · or press 1–5 here · F = fullscreen</div>
    </header>
    <div class="lobbyGrid">
      <section class="joinCard">
        <div class="step">Scan with a phone, or on a PC go to</div>
        <div id="joinUrl" class="url"></div>
        <div id="qr"></div>
        <div class="codeLbl">ROOM CODE</div>
        <div id="code" class="code">····</div>
        <div id="netStatus" class="netStatus">Opening room…</div>
      </section>
      <section class="right">
        <h2>Players <small id="pcount"></small></h2>
        <div id="plist" class="plist"></div>
        <h2>Games <small>bots join if you're playing alone</small></h2>
        <div id="glist" class="glist"></div>
      </section>
    </div>
  </div>

  <canvas id="cv" class="hidden"></canvas>

  <div id="results" class="overlay hidden">
    <h2 id="resTitle"></h2>
    <ol id="resList"></ol>
    <div class="muted">Back to the lobby in a moment…</div>
  </div>
  <div id="banner"></div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="shared.js"></script>
  <script src="sfx.js"></script>
  <script src="games.js"></script>
  <script src="tv.js"></script>
</body>
</html>
