<title>Couch Chaos — TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&family=Bungee&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1795844507">
<link rel="stylesheet" href="tv.css?v=1795844507">
<link rel="stylesheet" href="tokens.css?v=1795844507">
</head>
<body class="tv nativeWait">
  <canvas id="snow"></canvas>

  <div id="start" class="overlay splash">
    <div class="spMark"><span class="w1">couch</span><span class="w2">chaos<em>os</em></span></div>
    <div class="spLoad"><i></i><span id="spText">Starting the console…</span></div>
    <button id="startBtn" class="big">▶ Start</button>
  </div>

  <div id="home" class="hidden">
    <header class="topbar-tv">
      <div class="brand"><span class="logo sm">COUCH<span>CHAOS</span></span><span class="ed">❄️ Winter Edition</span></div>
      <div class="topRight">
        <div id="avatars" class="avatars"></div>
        <div class="codePill">Room <b id="codeSmall">····</b></div>
        <div id="clockTv" class="clockTv"></div>
      </div>
    </header>

    <section class="heroRow">
      <div id="hero" class="hero">
        <div class="heroArt"><span id="heroEmoji"></span></div>
        <div class="heroInfo">
          <div id="heroCat" class="heroCat"></div>
          <h1 id="heroTitle"></h1>
          <p id="heroDesc"></p>
          <div class="badges"><span id="heroCtrl" class="badge"></span><span id="heroPlayers" class="badge"></span><span id="heroMins" class="badge"></span></div>
          <div class="heroBtns"><button id="heroPlay" class="btnPlay">▶ Play</button><button id="heroParty" class="btnGhost">🎉 Party Mode</button></div>
        </div>
      </div>
      <aside class="joinBox">
        <div class="joinTitle">📱 Join with your phone or PC</div>
        <div id="qr"></div>
        <div class="code" id="code">····</div>
        <div id="joinUrl" class="url"></div>
        <div id="netStatus" class="netStatus">Opening room…</div>
      </aside>
    </section>

    <div id="rows" class="rows"></div>
    <div class="hintBar">🎮 The 👑 VIP uses their phone as a remote · ⬅️➡️⬆️⬇️ + OK · or use the keyboard / mouse here</div>
  </div>

  <div id="intro" class="hidden">
    <div class="introCard">
      <div id="introArt" class="introArt"><div class="rays"></div><span id="introEmoji"></span></div>
      <div class="introBody">
        <div id="introCat" class="heroCat"></div>
        <h1 id="introTitle"></h1>
        <div id="introCtrl" class="badge"></div>
        <ol id="introHow" class="how"></ol>
        <div id="introReady" class="readyRow"></div>
        <div class="introFoot"><span id="introTimer"></span> · Tap <b>READY</b> on your phone</div>
      </div>
    </div>
  </div>

  <canvas id="cv" class="hidden"></canvas>
  <canvas id="camView" class="hidden" width="400" height="300"></canvas>

  <div id="results" class="overlay hidden">
    <div id="resKicker" class="kicker"></div>
    <h2 id="resTitle"></h2>
    <div id="podium" class="podium"></div>
    <ol id="resList"></ol>
    <div id="resFoot" class="muted"></div>
  </div>
  <div id="banner"></div>
  <div id="reacts"></div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>window.Peer || document.write('<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"><\/script>')</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="turn-config.js?v=1795844507"></script>
  <script src="owner.js?v=1795844507"></script>
  <script src="shared.js?v=1795844507"></script>
  <script src="voice.js?v=1795844507"></script>
  <script src="sfx.js?v=1795844507"></script>
  <script src="engine.js?v=1795844507"></script>
  <script src="games-song.js?v=1795844507"></script>
  <script src="native.js?v=1795844507"></script>
  <script src="catalog.js?v=1795844507"></script>
  <script src="tv.js?v=1795844507"></script>
</body>
</html>
